[package]
name = "reqly"
version = "0.1.0"
description = "A compact desktop API client"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reqly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = [
    "tauri/wry",
    "tauri/compression",
    "tauri/common-controls-v6",
    "tauri/dynamic-acl",
    "tauri/x11",
    "tauri/dbus",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "socks", "gzip", "brotli", "deflate"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "time"] }
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.13"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
