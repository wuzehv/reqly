name: Build macOS Universal DMG

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    name: Build Universal DMG
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore universal bundle cache
        id: universal-bundle-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos
            src-tauri/target/universal-apple-darwin/release/bundle/dmg
          key: reqly-macos-universal-${{ github.sha }}

      - name: Set up Node.js
        if: steps.universal-bundle-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        if: steps.universal-bundle-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust build
        if: steps.universal-bundle-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-universal
          cache-on-failure: true

      - name: Install frontend dependencies
        if: steps.universal-bundle-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build macOS universal app
        if: steps.universal-bundle-cache.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri -- build --target universal-apple-darwin --bundles app

      - name: Verify executable architecture
        run: |
          APP_EXECUTABLE="src-tauri/target/universal-apple-darwin/release/bundle/macos/reqly.app/Contents/MacOS/reqly"
          file "$APP_EXECUTABLE"
          lipo "$APP_EXECUTABLE" -verify_arch x86_64 arm64

      - name: Create macOS DMG
        if: steps.universal-bundle-cache.outputs.cache-hit != 'true'
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/reqly.app"
          DMG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          STAGING_DIR="$RUNNER_TEMP/reqly-dmg"
          VERSION="$(node -p 'require("./package.json").version')"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR" "$DMG_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/reqly.app"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create \
            -volname "Reqly" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_DIR/reqly_${VERSION}_universal.dmg"

      - name: Verify DMG image
        run: |
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: reqly-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reqly-macos-updater
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14
